<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://i.ibb.co/pB8Hw7KX/icon.png" />
    <link rel="apple-touch-icon" href="https://i.ibb.co/pB8Hw7KX/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#CF996C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FoodHub" />
    <meta name="description" content="FoodHub - Your Ultimate Recipe Management & Discovery App" />
    
    <!-- ✅ UPDATED CSP - Allow YouTube Embeds & ImgBB -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   connect-src 'self' http://localhost:5000 http://localhost:5173 ws://localhost:5000 wss://localhost:5000 https://accounts.google.com https://*.google.com https://www.gstatic.com https://api.gemini.com https://generativelanguage.googleapis.com https://www.googleapis.com https://*.cloudinary.com https://detect.roboflow.com https://infer.roboflow.com https://api.roboflow.com https://www.foodhubrecipe.site https://foodhubrecipe.site; 
                   script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://*.google.com https://www.gstatic.com https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; 
                   style-src 'self' 'unsafe-inline' https://accounts.google.com https://*.google.com https://fonts.googleapis.com https://unpkg.com https://cdn.jsdelivr.net; 
                   img-src 'self' data: https: http: blob: https://i.ibb.co;
                   font-src 'self' https://fonts.gstatic.com https://unpkg.com https://cdn.jsdelivr.net data:;
                   frame-src 'self' https://accounts.google.com https://*.google.com https://www.youtube.com https://www.youtube-nocookie.com;
                   media-src 'self' https://www.youtube.com https://*.googlevideo.com;">
    
    <title>FoodHub - Your Recipe Companion</title>
    
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="manifest" href="/manifest.json">
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('✅ Service Worker registered:', registration);
            })
            .catch(error => {
              console.log('❌ Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
